# typos (https://github.com/crate-ci/typos) configuration.
#
# The repo carries French prose in comments, docs and BDD test fixtures, plus
# deliberate typo fixtures (e.g. `wieght`, `mdoel` in error-path tests) and
# identifier fragments the tokenizer splits out (`dist_ba` -> `ba`,
# `np.arange` -> `arange`, `ANDed` -> `Ded`). Every entry below self-maps a
# word to itself, i.e. "accept as spelled" — audited one by one on
# 2026-08-18: the baseline contained zero genuine English typos. New words
# NOT in this list still fail the gate, which is the point: the gate exists
# to catch future real typos, not to relitigate the existing vocabulary.
#
# To accept a new legitimate word, add `word = "word"` under
# [default.extend-words] (keys are matched case-insensitively).

[files]
extend-exclude = [
    "*.lock",
    "target/",
    "*.svg",
]

[default.extend-words]
abd = "abd"
abord = "abord"
accepte = "accepte"
adresse = "adresse"
