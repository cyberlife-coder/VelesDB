name: Compatibility Matrix

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  # rustup never installs a toolchain on its own: a Rust call reached before the
  # job's install step fails here instead of installing mid-build.
  RUSTUP_AUTO_INSTALL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux all features
            os: ubuntu-latest
            command: cargo check --workspace --all-targets --all-features --exclude velesdb-python
          # velesdb-wasm is wasm32-only; it is checked in the wasm-no-default job below.
          - name: Linux no default features
            os: ubuntu-latest
            command: cargo check -p velesdb-core --no-default-features
          - name: Windows all features
            os: windows-latest
            command: cargo check --workspace --all-targets --all-features --exclude velesdb-python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-compat-${{ matrix.os }}"

      - name: Run compatibility check
        shell: bash
        run: ${{ matrix.command }}

  wasm-no-default:
    name: WASM no default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-compat-wasm"

      - name: Check velesdb-core and velesdb-wasm on wasm32 no-default-features
        run: cargo check -p velesdb-core -p velesdb-wasm --target wasm32-unknown-unknown --no-default-features

  loom-check:
    # This is a compile check (no test run), so it's deterministic — no
    # flake risk to weigh against making the gate required. Loom is also
    # how we catch concurrency-model drift between the `loom` and non-loom
    # builds; silencing this gate would let breakage land for free.
    name: Loom check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # loom needs only `--cfg loom`, which the pinned toolchain builds.
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-compat-loom"

      - name: Check loom feature build
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo check -p velesdb-core --features loom,persistence
