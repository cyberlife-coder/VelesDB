# Upgrade guard for velesdb-memory: a user's data survives an upgrade.
#
# velesdb-memory stores what users chose to remember. This replays what they do
# with the last published release and this tree: write a store with the
# published crate, open it with this tree, write again, roll back to the
# published crate, and kill the writer mid-write. Any lost, altered or
# unreadable fact fails the job. See scripts/memory_upgrade_guard.py.
#
# It runs on pull requests that touch the memory crate or the core it builds
# against, and gates the crates.io publish in release-memory.yml. It is not in
# `CI Success` because it needs two cold cargo builds (scripts/guards.json).
name: Memory Upgrade Guard

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/velesdb-memory/**'
      - 'crates/velesdb-core/**'
      - 'scripts/memory_upgrade_guard.py'
      - 'scripts/memory-upgrade-guard/**'
      - '.github/workflows/memory-upgrade-guard.yml'

concurrency:
  group: memory-upgrade-guard-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # rustup never installs a toolchain on its own: a Rust call reached before the
  # job's install step fails here instead of installing mid-build.
  RUSTUP_AUTO_INSTALL: "0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  upgrade-guard:
    name: Upgrade Guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # No rust-cache: the driver projects are generated by the script, so there
      # is no manifest at restore time to key a cache on.
      - name: Replay upgrade, rollback and crash against the last release
        run: python3 scripts/memory_upgrade_guard.py --facts 3000 --crashes 3 --work-dir target/memory-upgrade-guard
