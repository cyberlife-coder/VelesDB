# =============================================================================
# VelesDB Core - Continuous Integration Workflow (Optimized)
# =============================================================================
# Stratégie ultra-optimisée pour réduire les coûts GitHub Actions :
# - Jobs parallèles (lint, test, security en même temps)
# - Cache unifié et partagé entre jobs
# - Outils pré-compilés via taiki-e/install-action
# - Path filtering agressif
# - PR: validation minimale | main: coverage + benchmarks complets
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - '*.md'
      - 'crates/**'
      - 'sdks/typescript/**'
      - 'conformance/**'
      - 'benchmarks/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/reference/**'
      - 'integrations/**'
      - 'demos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'sonar-project.properties'
      - '.github/workflows/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
  # No `paths:` filter here (unlike push, above): the "CI Success" job is a
  # required status check on main/develop branch protection. A path filter
  # on `pull_request` means GitHub creates zero check-runs for a PR whose
  # diff touches none of the listed paths (a pure backmerge, a docs-only
  # change outside docs/reference/**, a PR that's a no-op relative to base)
  # — not "failing", but *absent*, which blocks the merge forever with no
  # way to resolve it short of a manual `workflow_dispatch`. Hit in
  # production: PR #1465 (a zero-diff backmerge) sat blocked for ~7h before
  # this was diagnosed. Required checks must always run; only the
  # cost-saving `push` trigger (which doesn't gate anything) should be
  # path-filtered.
  pull_request:
    branches: [main, develop]
    # `ready_for_review` is NOT in the default set ([opened, synchronize,
    # reopened]). pr-governance.yml declared it before being folded in below,
    # so leaving `types:` implicit here would have silently narrowed it: a
    # draft turned "ready" with no new commit would never be re-governed.
    # Pinned by scripts/tests/test_ci_gate_reachability.py.
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual trigger so coverage can be refreshed on demand (e.g. after a
  # config-only commit to main that skipped the path-filtered CI, leaving the
  # Codacy coverage badge stale).
  workflow_dispatch:

# Annuler les runs précédents pour la même branche/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # 1.90 is the workspace MSRV: roaring 0.11.4 declares rust-version = 1.90.0,
  # so a 1.89 toolchain only builds when the dep is already in cache.
  RUST_VERSION: "1.90"
  # Skip Python detection for pyo3 - avoids environment contamination issues
  PYO3_NO_PYTHON: "1"

jobs:
  # ===========================================================================
  # Lint & Format (parallèle avec test et security)
  # ===========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      # rust-cache restores target/ INCLUDING the clippy .fingerprint entries
      # for workspace crates. With warm fingerprints cargo skips re-linting
      # "unchanged" crates, so violations of lints that became enforced after
      # the fingerprint was cached are silently skipped. This bit for real:
      # the 1.89 pedantic debt was only discovered via a chance fingerprint
      # miss (PRs #1394/#1396). Dropping build artifacts for the workspace
      # crates ONLY forces a full re-lint of first-party code on every run
      # while keeping all third-party deps cached (moderate cost, ~1-3 min).
      - name: Drop cached workspace fingerprints (force full re-lint)
        run: |
          set -euo pipefail
          # -r: never run a bare `cargo clean` (full wipe) on empty input.
          cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | "-p", .name' \
            | xargs -r cargo clean

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Closes the --no-default-features matrix gap from #1472: nothing in CI
      # previously checked the workspace with every crate's own default
      # features disabled, so cross-crate feature-unification mismatches
      # (e.g. a cfg-gated call site in one crate vs. the feature state its
      # dependency actually ends up unified to) went undetected.
      # velesdb-python est exclu ici depuis que `extension-module` est passe
      # derriere sa feature `default` : ce gate le desactive, et
      # `PYO3_NO_PYTHON: "1"` (env du WORKFLOW, plus haut) empeche alors
      # build.rs de trouver un interpreteur pour emettre les lignes de lien —
      # `attempted to link to Python shared library but config does not
      # contain lib_name`. Le crate a ses propres etapes dediees (clippy
      # --lib, tests Rust) qui, elles, posent l'environnement qu'il lui faut.
      - name: Check --no-default-features (workspace matrix gap, #1472)
        run: cargo check --workspace --no-default-features --exclude velesdb-python

      # The workspace check above unifies features across crates, so a feature
      # that only compiles because a SIBLING feature happens to be on still
      # passes it. Each optional feature of velesdb-memory is therefore checked
      # in isolation. The role-named HTTP features are canonical; `ollama` and
      # `extract` remain compatibility aliases and must keep compiling too.
      #
      # `--all-targets` is part of the contract, not an embellishment: without
      # it this step never compiles the test and example targets, and sixteen
      # BDD suites plus six examples sat broken under isolated features with
      # this step green (#1765) — a target that cannot fail the build is not
      # guarded by it.
      - name: Check each velesdb-memory feature in isolation
        run: |
          set -eu
          for feat in mcp http context persistence embedder-http extractor-http ollama extract; do
            echo "::group::--features $feat"
            cargo check -p velesdb-memory --no-default-features --features "$feat" --all-targets
            echo "::endgroup::"
          done

      # The extraction backend's unit tests are pure parsing and prompt
      # building: none opens a socket. Run them under the canonical role name
      # and its compatibility alias so neither path can silently stop enabling
      # the implementation it promises.
      - name: Test the velesdb-memory extraction features
        run: |
          cargo test -p velesdb-memory --lib --no-default-features --features extractor-http,persistence
          cargo test -p velesdb-memory --lib --no-default-features --features extract,persistence
          cargo test -p velesdb-memory --test default_build_carries_semantic_backends \
            --no-default-features --features ollama,extract

      # Same hole as the step above, left open for the whole HTTP transport:
      # six `[[test]]` targets declare `required-features = ["http"]` and no
      # `cargo test` anywhere passed it, so fourteen tests had never run on CI
      # — TLS termination, the graceful SIGTERM drain, the store-lock `flock`
      # guard and a twenty-way concurrency stress among them.
      #
      # That is not a peripheral build: `--http` is how a daemon serves
      # several MCP clients from ONE process instead of each fighting over the
      # store's single-writer lock, so it is what a multi-client setup
      # actually runs.
      #
      # `scripts/tests/test_test_target_reachability.py` now fails when any
      # gated target is reachable by no command here, so this cannot silently
      # reopen — for `http` or for the next feature.
      - name: Test the velesdb-memory http transport
        run: cargo test -p velesdb-memory --features http

      # velesdb-memory publishes independently, and `cargo publish` verifies
      # the tarball against velesdb-core AS PUBLISHED ON CRATES.IO — not the
      # core sitting next to it in this workspace. Any call into a core API
      # that is not released yet therefore compiles perfectly here and breaks
      # the release, at tag time, with nothing left to do but revert.
      #
      # That is not hypothetical: 0.11.3 shipped exactly that way (its MCPB
      # bundles reached the registry before packaging failed; no crate was
      # ever published), and the same trap was caught by hand on a PR again
      # on 2026-07-28. The identical dry-run existed only in
      # `release-memory.yml` ("Validate packaging"), i.e. AFTER the tag — too
      # late by construction. Running it per PR is what makes the invariant
      # "develop is always publishable" enforceable instead of aspirational.
      #
      # `--locked` mirrors the release job and fails on any Cargo.lock drift
      # rather than silently updating it.
      # velesdb-memory se publie contre le velesdb-core de CRATES.IO, jamais
      # celui de l'arbre. Une API core ajoutee et appelee depuis memory sans
      # release de core casse donc la publication — c'est ce qui a fait rater
      # la 0.11.3, et le controle n'existait alors qu'au moment du tag, trop
      # tard. Ici il echoue des la PR.
      #
      # Une SEULE exception, et elle est reconnaissable : pendant un bump de
      # workspace, memory reclame un velesdb-core que personne n'a encore
      # publie. Cargo le dit precisement — « failed to select a version for
      # the requirement velesdb-core » — alors qu'une API manquante donne un
      # E0599 a la compilation. Deux echecs qui n'ont rien a voir, et seul le
      # premier est transitoire : la release de core, quelques minutes plus
      # tard, le fait disparaitre. Bloquer dessus rendrait tout bump de
      # workspace impossible.
      - name: Validate velesdb-memory packaging (dry-run, publishability gate)
        run: |
          set +e
          out=$(cargo publish -p velesdb-memory --dry-run --locked 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "velesdb-memory se publie contre le core de crates.io."
            exit 0
          fi
          if printf '%s' "$out" | grep -q 'failed to select a version for the requirement `velesdb-core'; then
            echo "::notice::velesdb-memory demande un velesdb-core pas encore publie — bump de workspace en cours, la release de core leve ce blocage."
            printf '%s\n' "$out" | tail -20
            exit 0
          fi
          printf '%s\n' "$out"
          echo "::error::velesdb-memory ne se publierait pas. Une API core utilisee ici doit d'abord exister sur crates.io (cf. l'echec de la 0.11.3)."
          exit 1

      - name: Run Clippy (strict)
        run: |
          cargo clippy --workspace --all-targets --features persistence,gpu,update-check \
            --exclude velesdb-python --exclude velesdb-node \
            -- -D warnings -D clippy::pedantic

      # velesdb-node is a cdylib: `--all-targets` would build a test harness that
      # links N-API symbols and fail (same reason velesdb-python is excluded
      # above). Lint just its library target, which links cleanly. The crate's
      # [lints] table already enables clippy::pedantic with the workspace allows.
      - name: Run Clippy (velesdb-node cdylib)
        run: cargo clippy -p velesdb-node --lib -- -D warnings

      # velesdb-python was excluded from the workspace clippy for the same
      # cdylib reason as velesdb-node — but unlike node it never got the
      # dedicated `--lib` step, so it was linted by NOTHING: not this
      # workflow, not compat-matrix (which excludes it too), not the git
      # hooks. `cargo check` in propagation-guard compiled it; nothing
      # linted it. That gap is what let a type change land green locally
      # and fail here on `mismatched types`.
      #
      # `--lib` links cleanly (0 findings when introduced) and the crate's
      # [lints] table already carries the workspace pedantic set.
      - name: Run Clippy (velesdb-python cdylib)
        env:
          PYO3_PYTHON: python3
        run: cargo clippy -p velesdb-python --lib -- -D warnings

      - name: Run Clippy undocumented unsafe blocks (core)
        run: |
          cargo clippy -p velesdb-core --lib --bins \
            --features persistence,gpu,update-check \
            -- -A warnings -D clippy::undocumented_unsafe_blocks

      - name: Verify SAFETY template (production code)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          # F-3.12: validate SAFETY templates in EVERY production crate, not
          # just velesdb-core. Bindings (velesdb-python, velesdb-wasm,
          # velesdb-mobile, tauri-plugin-velesdb) contain unsafe blocks too and
          # were previously unchecked, which let one incomplete template slip
          # through (F-3.2).
          mapfile -t PROD_RS_FILES < <(
            git diff --name-only "$BASE_SHA" "${{ github.sha }}" \
              | grep '\.rs$' \
              | grep -E '^crates/[^/]+/src/' \
              | grep -v '/tests/' \
              | grep -v '/benches/' \
              | grep -Ev '_tests?\.rs$'
          )
          if [[ ${#PROD_RS_FILES[@]} -eq 0 ]]; then
            echo "No changed production Rust files to validate."
            exit 0
          fi
          python3 scripts/verify_unsafe_safety_template.py --files "${PROD_RS_FILES[@]}" --strict

      - name: Check TODO/FIXME/HACK governance (production code)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t CORE_RS_FILES < <(
            git diff --name-only "$BASE_SHA" "${{ github.sha }}" \
              | grep '\.rs$' \
              | grep '^crates/velesdb-core/src/' \
              | grep -v '/tests/' \
              | grep -v '/benches/' \
              | grep -Ev '_tests?\.rs$'
          )
          if [[ ${#CORE_RS_FILES[@]} -eq 0 ]]; then
            echo "No changed production Rust files to validate."
            exit 0
          fi
          python3 scripts/check-todo-annotations.py --files "${CORE_RS_FILES[@]}"

      # Freezes the inline-test-module debt: a file may keep an inline
      # #[cfg(test)] mod {...} it already has, but neither a new file nor a
      # bigger block is allowed in. Whole-tree, not diff-scoped, since the
      # baseline itself is the frozen state to compare against.
      - name: Check inline test-module debt against the frozen baseline
        run: python3 scripts/check-inline-tests.py

      - name: Check for .unwrap() in production code
        run: python3 scripts/check_prod_unwraps.py

      # REL-07 ran only at release time (release.yml), so a version drift in a
      # policed manifest was invisible until tagging. Running the same checker
      # at PR time surfaces the drift in the PR that introduces it (<5s, pure
      # python, no build needed).
      - name: Verify version sync across policed manifests (REL-07, PR-time)
        run: python3 scripts/check-version-sync.py

      - name: Test feature-claims audit script
        run: python3 -m unittest scripts.tests.test_check_feature_claims

      - name: Test prod-unwraps audit script
        run: python3 -m unittest scripts.tests.test_check_prod_unwraps

      - name: Test inline-tests audit script
        run: python3 -m unittest scripts.tests.test_check_inline_tests

      - name: Audit feature claims vs exports
        run: python3 scripts/check-feature-claims.py

      - name: Audit performance claims consistency
        run: python3 scripts/check-perf-claims.py --no-criterion

      # Both crates pull their own README into the crate docs with
      # `#![doc = include_str!("../README.md")]`, so this step also type-checks
      # every ```rust block in crates/velesdb-core/README.md and
      # crates/velesdb-server/README.md. A README snippet that stops matching
      # the API fails here instead of rotting unnoticed.
      - name: Check doctests compile
        run: |
          cargo test --doc --package velesdb-core
          cargo test --doc --package velesdb-server
        continue-on-error: false  # EPIC-080: Doctests fixes completed

  # ===========================================================================
  # Tests unitaires (parallèle avec lint et security)
  # TODO(S1-05): Add Windows and macOS test matrix for cross-platform coverage
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free ~35 GB of disk space by dropping pre-installed tooling we do
      # not use (Android SDK, .NET, Haskell/GHC, cached Docker images).
      # Without this the full test matrix link phase runs out of space —
      # `ld` dies with SIGBUS when it cannot mmap more pages. Observed on
      # PR #633 (two consecutive runs, warning: "Free space left: 80 MB").
      #
      # Flag rationale:
      # * `tool-cache: false` — keeps rustup + the toolchain restored by
      #   `Swatinem/rust-cache`.
      # * `large-packages: false` — intentionally OFF. The action's
      #   `large-packages` flag runs `apt-get autoremove -y` which
      #   cascade-removes `libgl1-mesa-dri` and its reverse-dependencies,
      #   including `glib-2.0-dev` / `gtk-3-dev` that `glib-sys` / Tauri
      #   transitive deps need. Pulling those back in via
      #   `awalsh128/cache-apt-pkgs-action` below is unreliable once
      #   autoremove has touched them, so we simply keep them installed.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Run tests
        run: |
          cargo test --workspace --features persistence,gpu,update-check \
            --exclude velesdb-python --exclude velesdb-node \
            -- --test-threads=1
        env:
          RUST_TEST_THREADS: 1

      # The workspace run above excludes velesdb-python, and until this step
      # existed NO workflow ran its Rust tests: they could not even link. The
      # crate is a `cdylib` whose pyo3 carried `extension-module` unconditionally,
      # which tells PyO3 to leave the libpython symbols unresolved — right for a
      # wheel loaded by an interpreter, fatal for a test binary that must supply
      # them itself. `--no-default-features` now drops that flag (the `default`
      # feature keeps it on for every other build, wheel included) so the harness
      # links libpython and the tests actually run.
      #
      # numpy must be importable by the EMBEDDED interpreter: `extract_vector`
      # probes the numpy C-API capsule before falling back to a plain list, and
      # the numpy crate panics rather than erroring when the capsule is missing.
      # An embedded interpreter resolves its prefix from the linked libpython,
      # not from the venv's `pyvenv.cfg` (that lookup keys off the executable,
      # which here is the test binary), so pointing PYO3_PYTHON at the venv is
      # not enough — PYTHONPATH is what makes its site-packages visible.
      - name: Test velesdb-python (Rust unit tests)
        run: |
          python3 -m venv /tmp/velesdb-python-tests
          /tmp/velesdb-python-tests/bin/pip install --quiet --upgrade pip numpy
          SITE="$(/tmp/velesdb-python-tests/bin/python -c 'import numpy, os; print(os.path.dirname(os.path.dirname(numpy.__file__)))')"
          # `env -u PYO3_NO_PYTHON` et pas `PYO3_NO_PYTHON: ""` : le workflow
          # pose cette variable pour tous les jobs, et pyo3-build-config teste
          # sa PRESENCE, pas sa valeur — une chaine vide reste definie, donc
          # have_python_interpreter() renvoie false et PYO3_PYTHON n'est jamais
          # lu. Le build tombe alors sur un config abi3 sans lib_name et
          # echoue : « attempted to link to Python shared library but config
          # does not contain lib_name ». La retirer de l'environnement est le
          # seul moyen sur.
          env -u PYO3_NO_PYTHON \
            PYO3_PYTHON=/tmp/velesdb-python-tests/bin/python PYTHONPATH="$SITE" \
            cargo test -p velesdb-python --lib \
              --no-default-features --features velesdb-core/default

      # Real-stdio MCP end-to-end (6 tools + text/media retrieve round-trip).
      # The debug binary is already built by the workspace test compile above;
      # cargo build is a cache no-op that guarantees it exists.
      - name: MCP server e2e (stdio)
        run: |
          cargo build -p velesdb-memory
          python3 crates/velesdb-memory/examples/context_savings/real_measures/mcp_e2e.py

      # The fast hook harness also runs in mcp-doc-contract without a Rust
      # toolchain. This second invocation owns the real wire check: it points
      # at the binary built from this checkout immediately above, never at an
      # arbitrary installation on PATH. Missing or renamed `risk` is a hard
      # failure inside the harness, not a skip that reads like a pass.
      - name: Agent hook contract against current checkout binary
        run: bash integrations/agent-hooks/test/hooks.test.sh
        env:
          VELESDB_MEMORY_BIN_REAL: ${{ github.workspace }}/target/debug/velesdb-memory

  # ===========================================================================
  # Security Audit (parallèle - outils pré-compilés)
  # ===========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run security audit (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

  # ===========================================================================
  # NOTE: Miri & Loom moved to quality-deep.yml (weekly + manual)
  # This saves ~10-15 min of CI time per push
  # Run manually: Actions → Quality Deep → Run workflow
  # ===========================================================================

  # ===========================================================================
  # WASM Build Check (compile check + wasm-bindgen test suites)
  # NOTE: compat-matrix.yml also checks WASM; this job provides a dedicated
  # signal visible in the ci-success summary.
  # ===========================================================================
  wasm-check:
    name: WASM Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci-wasm"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Install wasm32 target (belt-and-suspenders)
        run: rustup target add wasm32-unknown-unknown

      - name: Check WASM build (no default features)
        run: cargo check -p velesdb-wasm --no-default-features --target wasm32-unknown-unknown

      # Host-run (native target, no wasm32/Node involved) cross-implementation
      # parity gate: asserts the WASM SQ8/Binary quantization paths
      # (store_insert::encode_sq8/encode_binary, vector_ops/store_get decode)
      # produce byte-for-byte identical quantized data to
      # velesdb_core::{QuantizedVector, BinaryQuantizedVector} on a fixed
      # dataset covering the degenerate/extreme edges from the #1543
      # core-parity audit. Already covered transitively by `cargo test
      # --workspace` in the Tests job; named explicitly here for a dedicated,
      # visible signal on the WASM-specific job.
      - name: Run WASM↔core quantization parity tests (host)
        run: cargo test -p velesdb-wasm --lib quantization_parity_tests

      # The wasm-bindgen suites (tests/*.rs gated on target_arch = "wasm32",
      # e.g. memory_wedge_web.rs's JS-marshalling regression tests) compile
      # to empty binaries under the native test job and are invisible to the
      # cargo check above — without this step they never run in CI at all.
      - name: Install wasm-pack
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: wasm-pack

      - name: Run wasm-bindgen tests (Node)
        run: python3 scripts/run-wasm-bindgen-tests.py --root .

  # ===========================================================================
  # OpenAPI Drift Check
  # Regenerates the committed docs/openapi.{json,yaml} snapshots from the
  # utoipa-derived schema and fails if they differ from what is checked in,
  # so the spec can never silently drift from the code.
  # ===========================================================================
  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci-openapi"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Regenerate OpenAPI snapshots
        run: cargo test -p velesdb-server --features openapi generate_openapi_spec_files -- --ignored
        env:
          UPDATE_OPENAPI_SNAPSHOT: "1"

      - name: Check OpenAPI snapshots are up to date
        run: git diff --exit-code docs/openapi.json docs/openapi.yaml

  # ===========================================================================
  # MCP Doc Contract
  # The prose twin of openapi-drift above: openapi-drift keeps the committed
  # REST spec equal to the code; this keeps every surface that DESCRIBES an
  # MCP tool's return equal to the outputSchema the server publishes, as
  # captured in docs/reference/mcp-tools.json.
  #
  # It lives HERE, in ci.yml, and not in doc-contract.yml or
  # gate-contracts.yml, for a reason that WAS decisive and no longer is:
  # neither of those was in "CI Success"'s needs, and "CI Success" is the only
  # required check on develop and main — so nothing they found could block a
  # merge. doc-contract.yml's path filter was ALSO blind to
  # crates/velesdb-memory/src, sdks/, integrations/ and skills/, the very
  # directories this guard reads. A gate that is never triggered, or triggered
  # but not required, protects nothing. (That filter is widened in the same
  # change, so the doc-contract workflow stops missing those paths on push
  # too.)
  #
  # Since the fold of #1698 and #1710, BOTH of those workflows are called from
  # ci.yml and read by the "CI Success" chain, so `gate-contracts.yml`'s
  # `unittest discover -s scripts/tests` IS required — every suite under that
  # directory now blocks a merge, including the ones no job names. This job
  # stays as it is: naming its suites explicitly costs seconds and survives
  # someone narrowing the discover.
  #
  # No toolchain, no build: pure Python over committed text, seconds.
  # ===========================================================================
  mcp-doc-contract:
    name: MCP Doc Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Self-test first, same order as doc-contract.yml's freshness job: the
      # guard is pinned RED-then-GREEN on a synthetic repository (drift,
      # deleted declaration, empty registry, unreachable pin, empty sweep)
      # before it is trusted to judge the real tree.
      - name: Self-test the guard
        run: python3 -m unittest scripts.tests.test_check_mcp_doc_contract

      # Proves this very job is REQUIRED and BLOCKING, which are two
      # different things: in "CI Success"'s needs, read by the [[ ... ]]
      # chain that follows, comparing `== "success"`, failing through a
      # branch that exits non-zero, on a job with no continue-on-error — and
      # invoking the guard below WITHOUT `--mode warn`. Half-wiring it, or
      # leaving warn mode on, reports red on the PR page and blocks nothing;
      # check-doc-contract.sh's header records four routes that entered this
      # repository undocumented exactly that way.
      - name: Self-test the CI wiring
        run: python3 -m unittest scripts.tests.test_ci_gate_reachability

      # The bundled npm copies of the two skills, byte for byte. The blocking
      # comparison is crates/velesdb-node/__test__/skills-sync.spec.mjs under
      # node-binding-tests — this one costs milliseconds and no toolchain, so
      # it also pins the two hand-written pair registries against each other,
      # which nothing did.
      - name: Bundled skill copies are byte-identical
        run: python3 -m unittest scripts.tests.test_skill_copies_are_identical

      # A skill ships twice: in this repository and inside the npm package.
      # Whoever loads it has the open core and nothing else, so a passage
      # pointing at something only the closed repository holds is unactionable
      # where it is read. Self-test first, RED-then-GREEN on a synthetic tree,
      # same order as the guard above it.
      - name: Self-test the private-reference guard
        run: python3 -m unittest scripts.tests.test_check_skill_private_references

      - name: Versioned skills carry no private reference
        run: python3 scripts/check-skill-private-references.py

      # Which skill owns cross-session resumption. The working-context tools
      # were documented in the COMPRESSION skill and not once in the memory
      # one, so an agent loading the skill named after memory was never told
      # a previous session could be read back — and nobody was told to
      # discover sessions, so a mistyped id read as "no previous work".
      - name: Resumption is owned by the memory skill
        run: python3 -m unittest scripts.tests.test_skill_resumption_ownership

      # The agent-hook installer, and — finally — the hook harness itself.
      # `hooks.test.sh` was referenced by six documents and executed by ZERO
      # workflows: the exact shape of #1698, a gate nobody invokes. The suite
      # above it holds the wiring, so deleting this step turns that suite red
      # rather than turning the harness silent.
      - name: Self-test the agent-hook installer
        run: python3 -m unittest scripts.tests.test_sync_agent_hooks

      - name: Agent hook harness
        run: bash integrations/agent-hooks/test/hooks.test.sh

      # BLOCKING. Verified green on the whole tree (16 pinned surfaces, 20
      # declarations of load_working_context's envelope — including the three
      # agent session hooks and the napi `ts_return_type` shipped as the
      # .d.ts) when this job was added.
      - name: MCP return contract vs docs/reference/mcp-tools.json
        run: python3 scripts/check-mcp-doc-contract.py --verbose

  # ===========================================================================
  # Bench-sift1m Compile Check
  # Compiles (does NOT run) the SIFT1M bench and its unit tests with
  # `--features bench-sift1m` so API drift vs HnswIndex is caught on every
  # push instead of surfacing the next time someone tries to run the bench.
  # No dataset download, no benchmark execution, no test execution.
  # ===========================================================================
  bench-sift1m-compile:
    name: Bench SIFT1M Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: cargo check (bench + feature)
        run: cargo check -p velesdb-core --benches --features bench-sift1m

      - name: cargo check (sift1m loader unit tests)
        run: cargo check --tests -p velesdb-core --features bench-sift1m --test sift1m_loader_unit_tests

  # ===========================================================================
  # Python Integration Tests (uniquement si integrations/ modifié)
  # ===========================================================================
  python-integrations:
    name: Python Integrations
    runs-on: ubuntu-latest
    needs: test
    # Runs on PRs too (and gates CI Success) so connector regressions are
    # caught before merge — the LangChain suite once rotted to 21 failures
    # while this job was push-only and advisory.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo registry cache only (NOT the velesdb-python/target directory;
      # half-compiled pyo3 build artefacts from previous CI hotfix attempts
      # were causing pyo3-build-config to misdetect the interpreter even when
      # PYO3_PYTHON was set correctly).
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-integ-py-cargo-${{ hashFiles('Cargo.lock') }}

      # Build velesdb-python from source via PEP 517 (pip invokes maturin
      # through pyproject.toml's `build-backend = "maturin"`). pip activates
      # the running Python interpreter as the build target automatically,
      # which is the only path that has worked end-to-end for pyo3 in this
      # workflow (raw `maturin build` and `PyO3/maturin-action` both fail
      # with "abi3-py3* feature must be specified", even with PYO3_PYTHON
      # set explicitly — see hotfix log #649-#655).
      - name: Build & install velesdb-python from source
        run: |
          # PEP 517 default build (debug profile). MATURIN_PEP517_ARGS=--release
          # was rejected because the flag was forwarded to ALL maturin
          # subcommands including `pep517 write-dist-info` which does not
          # accept it. Debug build is acceptable for the integration test
          # suite; test datasets are small enough that performance overhead
          # is not measurable on the bench.
          pip install --upgrade pip maturin
          pip install ./crates/velesdb-python --force-reinstall

      - name: Install velesdb-common (local shared package)
        run: pip install -e integrations/common

      # All RAG/agent framework connectors are installed and tested from
      # source. Until 2026-06 only LlamaIndex ran here — the LangChain
      # suite was never executed in CI and rotted to 21 failures.
      - name: Install & Test LangChain integration
        run: |
          pip install -e "integrations/langchain[dev]"
          python -m pytest integrations/langchain/tests/ -v --tb=short

      - name: Install & Test LlamaIndex integration
        run: |
          pip install -e "integrations/llamaindex[dev]"
          python -m pytest integrations/llamaindex/tests/ -v --tb=short

      - name: Install & Test Haystack integration
        run: |
          pip install -e "integrations/haystack[dev]"
          python -m pytest integrations/haystack/tests/ -v --tb=short

      - name: Install & Test LangGraph integration
        run: |
          pip install -e "integrations/langgraph[dev]"
          python -m pytest integrations/langgraph/tests/ -v --tb=short

  # ===========================================================================
  # Python SDK Tests — velesdb-python (PyO3) binding functional suite.
  #
  # Until this job existed, crates/velesdb-python/tests/ was never run in CI:
  # the python-integrations job above exercises the three connector packages (LangChain / LlamaIndex / Haystack).
  # Runs on PRs too (no push-only gate) so binding regressions are caught
  # before merge. The slow recall gate (test_recall_gate.py, -m slow) is
  # excluded here — recall@10 >= 0.95 is enforced on a release wheel by
  # perf-gate-e2e.yml; a debug build is sufficient for the functional suite.
  # ===========================================================================
  python-sdk-tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-pysdk-cargo-${{ hashFiles('Cargo.lock') }}

      # PEP 517 source build (debug profile), identical to python-integrations.
      # numpy is a hard runtime dependency of the binding's NumPy fast paths.
      - name: Build & install velesdb-python from source
        run: |
          pip install --upgrade pip maturin numpy pytest
          pip install ./crates/velesdb-python --force-reinstall

      - name: Run velesdb-python functional tests
        working-directory: crates/velesdb-python
        run: python -m pytest tests/ -m "not slow" -p no:cacheprovider -q -W ignore::DeprecationWarning

  # Builds the napi addon and runs its Node test suite on PRs (gates CI Success)
  # so binding regressions are caught before merge. velesdb-node is a cdylib
  # excluded from `cargo test --workspace`, so this is its ONLY functional gate.
  node-binding-tests:
    name: Node Binding Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-node-cargo-${{ hashFiles('Cargo.lock') }}

      - name: License/dependency boundary gate
        run: |
          # The addon must bind velesdb-memory ONLY (memory semantics), never the
          # raw engine, and must not pull the MCP server stack into the prebuild.
          if cargo tree -p velesdb-node --depth 1 -e normal | grep -qE 'velesdb-core v'; then
            echo "::error::velesdb-node has a DIRECT velesdb-core dependency (license boundary)"; exit 1
          fi
          for banned in 'rmcp v' 'velesdb-server v'; do
            if cargo tree -p velesdb-node -e normal | grep -qE "$banned"; then
              echo "::error::velesdb-node resolves '$banned' (must stay out of the lean addon)"; exit 1
            fi
          done
          echo "✅ dependency/license boundary holds"

      # Debug profile (dev = panic=unwind) is sufficient for the functional suite;
      # the release prebuild uses the [profile.release-node] panic=unwind override.
      # `npm test` (not a hardcoded filename) so every __test__/*.spec.mjs file —
      # including new ones like skills-sync.spec.mjs — is picked up automatically;
      # see package.json's "test" script for the single source of truth on the glob.
      - name: Build napi addon + run Node tests
        run: python3 scripts/run-node-binding-tests.py --root .

      # Mirror the release assembly before any tag exists: test the root
      # tarball plus its native package from a clean npm install, never the
      # build directory where generated entrypoints happen to be present.
      - name: Smoke-test the packed Node package from a clean install
        working-directory: crates/velesdb-node
        run: |
          mkdir -p artifacts
          cp -- ./*.node artifacts/
          npx napi create-npm-dirs
          npx napi artifacts --output-dir ./artifacts
          for d in npm/*/; do cp LICENSE README.md "$d"; done
          node scripts/smoke-packed-package.mjs npm/linux-x64-gnu

      # EPIC-P-071/A1 non-regression gate: "the facts survive compilation".
      # Reuses the napi addon just built above (no second Rust build) — this
      # job is the cheapest place to run it: the "Tests" job never sets up
      # Node or builds the addon, so branching there would pay for a full
      # extra napi build for one offline, network-free JS test file.
      # gpt-tokenizer is installed here (not committed) per
      # examples/real-session-benchmark/README.md's prereqs.
      - name: Real-session benchmark — facts-survive gate (offline, no network)
        run: |
          npm install --no-save --no-audit --no-fund --prefix crates/velesdb-node gpt-tokenizer
          node --test examples/real-session-benchmark/test/facts-survive.test.mjs

  # ===========================================================================
  # Node Binding — path filter for the Windows leg below (#1515).
  #
  # Cheap ubuntu job (1x billing multiplier) that decides whether the Windows
  # job actually needs to build anything. The `pull_request` trigger at the
  # top of this file is intentionally NOT path-filtered (see the big comment
  # there — a path filter on `pull_request` can make a required check-run
  # simply never appear, permanently blocking merge). So this filtering can't
  # live in a job-level `if:`, which would produce the same "skipped, not
  # absent" trap only one level down; instead it runs unconditionally and
  # exposes an output that gates the actual work inside the Windows job's
  # steps, so that job always reports success/failure, never skipped.
  # ===========================================================================
  node-windows-changed:
    name: Node Binding (Windows) — path filter
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a shallow (depth-1) PR checkout only fetches the
          # merge commit itself, not the base commit `git diff` needs below.
          fetch-depth: 0

      - name: Determine if crates/velesdb-node changed
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -q '^crates/velesdb-node/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "crates/velesdb-node/** changed — Windows leg will build."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "crates/velesdb-node/** unchanged — Windows leg will no-op (cost guard)."
          fi

  # ===========================================================================
  # Node Binding Tests (Windows) — #1515.
  #
  # velesdb-memory-v0.10.0 needed three successive Windows-only fixes (#1509,
  # #1510, #1511), each found by the release workflow's
  # x86_64-pc-windows-msvc leg AFTER merge, because PR-time CI only ever
  # built/tested the addon on Linux. This job closes that gap by running the
  # same build + test on every PR that touches crates/velesdb-node/**.
  #
  # It deliberately reuses the EXACT sequence release-memory.yml's
  # `build-node` job now uses for x86_64-pc-windows-msvc, instead of
  # reinventing one that could reintroduce the same bugs:
  #   - `npx napi build --platform` — identical build invocation (debug
  #     profile here, same as the Linux node-binding-tests job above).
  #   - `node --test __test__/index.spec.mjs` instead of `npm test` — #1509:
  #     `npm test`'s `__test__/*.spec.mjs` glob (package.json) is not
  #     shell-expanded by npm's Windows shell wrapper on Node 20, so
  #     `npm test` fails outright with "Could not find '...\*.spec.mjs'"
  #     before a single test runs. `index.spec.mjs` is also exactly the file
  #     that carries the two other Windows fixes (#1510's rmSync/EPERM
  #     tolerance, #1511's fileURLToPath cross-process path fix), so running
  #     it here would have caught all three pre-merge.
  #   Coverage gap (tracked, matches the release job's own tradeoff): this
  #   only runs index.spec.mjs, not the full `__test__/*.spec.mjs` suite
  #   (remember_extracted.integration + skills-sync are Linux-only for now).
  #   The full suite still runs on every PR via the Linux node-binding-tests
  #   job above.
  # ===========================================================================
  node-binding-tests-windows:
    name: Node Binding Tests (Windows)
    runs-on: windows-latest
    needs: [test, node-windows-changed]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.node-windows-changed.outputs.relevant == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.node-windows-changed.outputs.relevant == 'true'
        with:
          node-version: '20'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.node-windows-changed.outputs.relevant == 'true'
        with:
          python-version: '3.12'

      - name: Install stable Rust toolchain
        if: needs.node-windows-changed.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.node-windows-changed.outputs.relevant == 'true'
        with:
          shared-key: "velesdb-ci-node-windows"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      # Debug profile, same rationale as the Linux job above. Explicit spec
      # file (not `npm test`) — see the job-level comment for why (#1509).
      - name: Build napi addon + run Node tests (Windows)
        if: needs.node-windows-changed.outputs.relevant == 'true'
        run: python scripts/run-node-binding-tests-windows.py --root .

      - name: Skipped — crates/velesdb-node/** unchanged
        if: needs.node-windows-changed.outputs.relevant != 'true'
        shell: bash
        run: echo "No changes under crates/velesdb-node/ on this PR — Windows build skipped to save CI minutes."

  # ===========================================================================
  # Coverage (main seulement)
  # ===========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Bound the job so a lost/hung runner fails fast (and can be re-run) instead
    # of hanging toward the 6h default — the full single-threaded suite under
    # llvm-cov + gpu features runs well within this.
    timeout-minutes: 45
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"

      # Prebuilt binary (with built-in download retries) instead of
      # `cargo install` from source — faster and avoids the compile/network
      # flakes that lost the runner mid-job on earlier release runs.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report and enforce threshold
        run: |
          # Run tests with coverage instrumentation and emit lcov report.
          # Threshold is 78%: closer to the 80% project target, with a small
          # margin for variance. The gpu/update-check features add code paths that
          # are not exercisable in CI (no GPU hardware), lowering measured coverage
          # vs the local 82.30% badge which was measured without those features.
          cargo llvm-cov --features persistence,gpu,update-check --workspace \
            --exclude velesdb-python --exclude velesdb-node \
            --fail-under-lines 78 \
            --lcov --output-path lcov.info \
            -- --test-threads=1

      # Codecov upload disabled — no CODECOV_TOKEN configured.
      # Coverage is reported via Codacy (see below).
      # To re-enable: add CODECOV_TOKEN to repository secrets and uncomment.
      # - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
      #   with:
      #     files: lcov.info
      #     token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: lcov.info
        env:
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: cyberlife-coder
          CODACY_PROJECT_NAME: VelesDB

      - name: Upload lcov for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 1

  # ===========================================================================
  # VelesQL Conformance (cross-ecosystem contract checks)
  # ===========================================================================
  velesql-conformance:
    name: VelesQL Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"

      - name: Core parser conformance
        run: cargo test -p velesdb-core --test velesql_parser_conformance

      - name: CLI parser conformance
        run: cargo test -p velesdb-cli --test velesql_parser_conformance

      - name: WASM parser conformance
        run: cargo test -p velesdb-wasm --test velesql_parser_conformance

      - name: Core executor conformance
        run: cargo test -p velesdb-core --features persistence --test velesql_executor_conformance

      - name: CLI executor conformance
        run: cargo test -p velesdb-cli --test velesql_executor_conformance

      - name: WASM executor conformance
        run: cargo test -p velesdb-wasm velesql_executor_conformance

      - name: Server REST conformance
        run: cargo test -p velesdb-server --test velesql_conformance_tests

      - name: TypeScript SDK conformance
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test -- velesql-contract-fixtures.test.ts

  # ===========================================================================
  # Performance Smoke Test (EPIC-026/US-002)
  # Blocking regression detection against baseline
  # ===========================================================================
  perf-smoke:
    name: Perf Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"

      - name: Run smoke benchmark
        run: |
          cargo bench -p velesdb-core --bench smoke_test -- --noplot

      - name: Export smoke benchmark results
        run: |
          python3 scripts/export_smoke_criterion.py

      - name: Compare with baseline
        run: |
          python3 scripts/compare_perf.py \
            --current benchmarks/results/latest.json \
            --baseline benchmarks/baseline.json \
            --threshold 15

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-smoke-results
          path: target/criterion/
          retention-days: 7

  # ===========================================================================
  # Benchmarks (main seulement - rapides uniquement)
  # ===========================================================================
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable # Intentionally unpinned - uses toolchain input
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-ci"

      - name: Run fast benchmarks only
        run: |
          cargo bench -p velesdb-core \
            --bench simd_benchmark \
            --bench filter_benchmark \
            -- --noplot

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 7

  # ===========================================================================
  # SonarCloud Analysis (quality gate for main/develop)
  # ===========================================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [lint, test, security, coverage]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-report
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ===========================================================================
  # Gates folded in from their own workflows
  #
  # These six ran as standalone workflows on `pull_request`, and `CI Success` is
  # the ONLY required check on develop — so each could be red while the merge
  # button stayed green. Requiring them through GitHub's branch-protection list
  # instead would keep the required set unversioned and unreadable by any guard,
  # which is the defect one level up. Calling them from here puts the required
  # set in reviewable YAML, and scripts/guards.json holds them to it.
  #
  # `workflow_call` ignores the callee's own `paths:` filters, so these now run
  # on every PR. Measured cost: 0.2 to 5.5 min each, against CI's ~29 min
  # critical path — they finish long before this job can start, so the wait is
  # unchanged. Filtering them conditionally instead would make a skipped job
  # report `skipped`, forcing the chain below to accept anything other than
  # `success` — the "skipped = green" ambiguity this fold exists to remove.
  # ===========================================================================
  gate-contracts:
    name: Gate Contracts
    uses: ./.github/workflows/gate-contracts.yml

  doc-contract:
    name: Doc Contract
    uses: ./.github/workflows/doc-contract.yml

  promise-contract:
    name: Promise Contract
    uses: ./.github/workflows/promise-contract.yml

  production-gates:
    name: Production Gates
    uses: ./.github/workflows/production-gates.yml

  propagation-guard:
    name: Propagation Guard
    uses: ./.github/workflows/propagation-guard.yml

  binary-size:
    name: Binary Size Gate
    uses: ./.github/workflows/binary-size.yml

  # ===========================================================================
  # Perf Gate (E2E) — QUALITY_BAR.md Gates 1 & 2, folded into `CI Success`.
  #
  # This gate ran for months as a standalone path-filtered workflow
  # (perf-gate-e2e.yml), which meant it could go red on a search-path PR
  # without holding the merge: it was never in ci-success's `needs`. Folding
  # it in uses the same two-job pattern as the Windows node leg above —
  # required checks must always run (#1465), so the filter job decides and
  # every step of the gate job is conditioned on its output; a PR that does
  # not touch the search hot path gets a green no-op, not an absent check.
  # The nightly 100K-scale recall validation stays in perf-gate-e2e.yml.
  # ===========================================================================
  perf-path-changed:
    name: Perf Gate (E2E) — path filter
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a shallow (depth-1) PR checkout only fetches the
          # merge commit itself, not the base commit `git diff` needs below.
          fetch-depth: 0

      - name: Determine if the search hot path changed
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qE '^crates/velesdb-core/src/(index|simd_native|quantization|fusion|wal|storage)/|^crates/velesdb-python/|^benchmarks/velesdb_benchmark\.py$|^\.github/workflows/ci\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "search hot path changed — perf gate will run."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "search hot path unchanged — perf gate will no-op (cost guard)."
          fi

  perf-gate-e2e:
    name: Perf Gate (E2E) — recall ≥ 0.95 + p50 sanity floor (10K/384D)
    runs-on: ubuntu-latest
    needs: [test, perf-path-changed]
    timeout-minutes: 30
    env:
      # Loose order-of-magnitude floor: GitHub-hosted runners are ~3-4×
      # slower and noisier than the i9-14900KF reference machine, so the
      # 450 µs contract p50 is gated locally and in release engineering;
      # this floor catches algorithmic regressions without runner-noise
      # false positives.
      P50_MAX_US: 1500
      RECALL_MIN: 0.95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.perf-path-changed.outputs.relevant == 'true'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        if: needs.perf-path-changed.outputs.relevant == 'true'
        with:
          toolchain: "1.90"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.perf-path-changed.outputs.relevant == 'true'
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.perf-path-changed.outputs.relevant == 'true'
        with:
          shared-key: "velesdb-perf-gate"

      - name: Build velesdb-python (release wheel)
        if: needs.perf-path-changed.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip "maturin>=1.7,<2" numpy
          # Release build is mandatory for a perf gate — debug builds are
          # 10×+ slower and force a meaningless threshold. We build a
          # release wheel and pip-install it; `maturin develop` would
          # complain about installing into the system interpreter in CI,
          # and pip's PEP 517 path does not currently forward `--release`
          # cleanly (see commentary in §test for the history).
          cd crates/velesdb-python
          maturin build --release --interpreter python3.11
          pip install --force-reinstall ../../target/wheels/velesdb-*.whl

      - name: Run benchmark (10K vectors, 384D, --recall, --json)
        if: needs.perf-path-changed.outputs.relevant == 'true'
        run: |
          python benchmarks/velesdb_benchmark.py \
            --datasets 10000 \
            --dimension 384 \
            --recall \
            --json \
            --output perf-report.json

      - name: Gate report on recall and p50 floor
        if: needs.perf-path-changed.outputs.relevant == 'true'
        id: gate
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          with open("perf-report.json") as f:
              report = json.load(f)

          p50_max_us = int(os.environ["P50_MAX_US"])
          recall_min = float(os.environ["RECALL_MIN"])

          # Find the 10K result block.
          ten_k = next(
              (r for r in report["results"] if r.get("num_vectors") == 10_000),
              None,
          )
          if ten_k is None:
              sys.exit("FAIL: no 10K result block in report")

          p50 = ten_k["search_p50_us"]
          p99 = ten_k["search_p99_us"]
          recall = report.get("recall", {}).get("recall_at_10_mean", 0.0)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Perf Gate (E2E) — 10K / 384D / WAL ON",
              "",
              f"- search p50: **{p50} µs** (CI floor: {p50_max_us} µs, contract on i9-14900KF: 450 µs)",
              f"- search p99: {p99} µs",
              f"- recall@10: **{recall:.4f}** (gate: ≥ {recall_min})",
              "",
          ]
          if summary_path:
              with open(summary_path, "a") as s:
                  s.write("\n".join(lines) + "\n")
          for line in lines:
              print(line)

          failed = []
          if recall < recall_min:
              failed.append(f"recall@10 {recall:.4f} < {recall_min}")
          if p50 > p50_max_us:
              failed.append(f"p50 {p50} µs > CI floor {p50_max_us} µs")
          if failed:
              sys.exit("FAIL: " + "; ".join(failed))
          print("PASS")
          PY

      - name: Upload perf report
        if: needs.perf-path-changed.outputs.relevant == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-report-${{ github.sha }}
          path: perf-report.json
          retention-days: 30

      - name: Skipped — search hot path unchanged
        if: needs.perf-path-changed.outputs.relevant != 'true'
        shell: bash
        # Block scalar, not a plain one: on a plain `run:` line a bare `#`
        # starts a YAML comment, which truncated this echo before its closing
        # quote and failed every no-op leg with `unexpected EOF` (#1857-era).
        run: |
          echo "Search hot path unchanged; perf gate no-ops green (required checks must always run, #1465)."

  # Last of the fold, and the one #1698 named: Git Flow, branch freshness and
  # the AI-attribution guard ran beside the required check, so none of them
  # could block a merge. Freshness matters most — it is the in-house
  # replacement for branch protection's `strict` (decision #1639), which is
  # off, so until this job existed nothing at all held a PR to its base.
  #
  # `permissions:` is explicit because a called workflow cannot exceed its
  # caller: ci.yml grants `contents: read` at the top level, and
  # pr-governance.yml declares `pull-requests: read` too.
  pr-governance:
    name: PR Governance
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-governance.yml

  # ===========================================================================
  # Summary (léger)
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, security, wasm-check, openapi-drift, mcp-doc-contract, velesql-conformance, perf-smoke, bench-sift1m-compile, perf-gate-e2e, python-sdk-tests, python-integrations, node-binding-tests, node-binding-tests-windows, gate-contracts, doc-contract, promise-contract, production-gates, propagation-guard, binary-size, pr-governance, sonarcloud]
    if: always()
    steps:
      # sonarcloud is intentionally absent from the gate below: it is an
      # external service (skipped on forks / token-less runs) and must not
      # block merges. It stays in `needs` so its status is visible here.
      - name: Check results
        run: |
          [[ "${{ needs.lint.result }}" == "success" ]] && \
          [[ "${{ needs.test.result }}" == "success" ]] && \
          [[ "${{ needs.wasm-check.result }}" == "success" ]] && \
          [[ "${{ needs.openapi-drift.result }}" == "success" ]] && \
          [[ "${{ needs.mcp-doc-contract.result }}" == "success" ]] && \
          [[ "${{ needs.velesql-conformance.result }}" == "success" ]] && \
          [[ "${{ needs.perf-smoke.result }}" == "success" ]] && \
          [[ "${{ needs.bench-sift1m-compile.result }}" == "success" ]] && \
          [[ "${{ needs.perf-gate-e2e.result }}" == "success" ]] && \
          [[ "${{ needs.python-sdk-tests.result }}" == "success" ]] && \
          [[ "${{ needs.python-integrations.result }}" == "success" ]] && \
          [[ "${{ needs.node-binding-tests.result }}" == "success" ]] && \
          [[ "${{ needs.node-binding-tests-windows.result }}" == "success" ]] && \
          [[ "${{ needs.gate-contracts.result }}" == "success" ]] && \
          [[ "${{ needs.doc-contract.result }}" == "success" ]] && \
          [[ "${{ needs.promise-contract.result }}" == "success" ]] && \
          [[ "${{ needs.production-gates.result }}" == "success" ]] && \
          [[ "${{ needs.propagation-guard.result }}" == "success" ]] && \
          [[ "${{ needs.binary-size.result }}" == "success" ]] && \
          [[ "${{ needs.pr-governance.result }}" == "success" ]] && \
          [[ "${{ needs.security.result }}" == "success" ]] && \
          echo "✅ CI passed" || { echo "❌ CI failed"; exit 1; }
