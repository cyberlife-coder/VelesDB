name: Production Gates

# Called by ci.yml on pull requests (see the note in gate-contracts.yml). The
# `pull_request` trigger is gone: this gate now reports inside `CI Success`,
# the only required check, instead of beside it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Run production gates
        run: bash scripts/run-production-gates.sh
