name: Production Gates

# Called by ci.yml on pull requests (see the note in gate-contracts.yml). The
# `pull_request` trigger is gone: this gate now reports inside `CI Success`,
# the only required check, instead of beside it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal
      - name: Run production gates
        run: bash scripts/run-production-gates.sh
