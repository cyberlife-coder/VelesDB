# =============================================================================
# VelesDB Core - Deep Quality Checks (Cost-Optimized)
# =============================================================================
# Stratégie: Weekly + Manual trigger pour éviter les coûts quotidiens
# Contient: Miri (UB detection), Loom (concurrency), Fuzz (robustness)
# Estimation: ~15-20 min de CI par run au lieu de chaque push
# =============================================================================

name: Quality Deep

on:
  # Weekly: Dimanche 3h du matin UTC (faible charge GitHub)
  schedule:
    - cron: '0 3 * * 0'
  
  # Manual trigger avec options
  workflow_dispatch:
    inputs:
      run_miri:
        description: 'Run Miri UB detection'
        type: boolean
        default: true
      run_loom:
        description: 'Run Loom concurrency tests'
        type: boolean
        default: true
      run_fuzz:
        description: 'Run fuzzing (5 min per target)'
        type: boolean
        default: true
      fuzz_duration:
        description: 'Fuzz duration in seconds'
        type: number
        default: 300
      run_crossover:
        description: 'Run deterministic cost-crossover harness'
        type: boolean
        default: true
      run_minimal_versions:
        description: 'Check velesdb-core and velesdb-memory, each alone, against their minimal dependency versions on Linux and macOS'
        type: boolean
        default: true

  # Only minimal-versions (below) runs on a pull request: every other job here
  # is gated on `schedule` or a dispatch input, so it skips. The filter lists
  # the manifests that job resolves, and not Cargo.lock: `cargo update`
  # discards the lockfile and resolves afresh, so a lockfile-only change cannot
  # change its verdict.
  pull_request:
    branches: [main, develop]
    paths:
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'
      - '.github/workflows/quality-deep.yml'

# Pas de concurrency cancel - ces tests sont importants
#
# Scheduled and dispatched runs each get a group of their own, so the rule
# above holds for them. Only a pull request's run is cancelled, by the next
# push to that pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # rustup never installs a toolchain on its own: a Rust call reached before the
  # job's install step fails here instead of installing mid-build.
  RUSTUP_AUTO_INSTALL: "0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # ===========================================================================
  # Miri UB Detection - Détecte undefined behavior dans unsafe code
  # ===========================================================================
  miri:
    name: Miri UB Detection
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_miri }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nightly: Miri ships with nightly only; the override below keeps every
      # cargo call of this job, rust-cache's included, on it.
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-miri"
          save-if: true

      # Distance module - code SIMD scalaire (pas les intrinsics)
      - name: Miri - distance module
        run: |
          cargo miri test --no-default-features \
            -p velesdb-core -- \
            distance:: --test-threads=1
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-symbolic-alignment-check"

      # Parser VelesQL - parsing user input
      - name: Miri - VelesQL parser
        run: |
          cargo miri test --no-default-features \
            -p velesdb-core -- \
            velesql::parser:: --test-threads=1
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

      # Storage vector_bytes - raw pointer manipulation
      - name: Miri - vector bytes storage
        run: |
          cargo miri test --no-default-features \
            -p velesdb-core -- \
            storage::vector_bytes:: --test-threads=1
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-symbolic-alignment-check"

      # ContiguousVectors / AllocGuard - manual allocation, raw pointers, resize
      - name: Miri - contiguous vectors & alloc guard
        run: |
          cargo miri test --no-default-features \
            -p velesdb-core --lib -- \
            perf_optimizations alloc_guard contiguous_resize --test-threads=1
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-symbolic-alignment-check"

  # ===========================================================================
  # Cost Crossover - travail déterministe par stratégie de filtre
  # ===========================================================================
  # Compte les évaluations de distance (jamais le wall-clock) par bande de
  # sélectivité exacte, sur un corpus et un graphe HNSW entièrement
  # déterministes : les chiffres sont comparables entre commits même sur des
  # runners partagés. La table JSON du log est la mesure d'alimentation de la
  # convergence des seuils (lots 3.2/2.2).
  cost-crossover:
    name: Cost Crossover (deterministic work counts)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_crossover }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-crossover"
          save-if: true

      - name: Cost crossover harness
        run: |
          cargo test -p velesdb-core --features persistence,internal-bench \
            --test cost_crossover -- --test-threads=1 --nocapture
          cargo test -p velesdb-core --features persistence,internal-bench \
            --test adaptive_resume_evals -- --test-threads=1 --nocapture

  # ===========================================================================
  # Loom Concurrency Tests - Détecte deadlocks et data races
  # ===========================================================================
  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_loom }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # loom needs only `--cfg loom`, which the pinned toolchain builds.
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-loom"
          save-if: true

      # Tests Loom existants (storage, sync primitives)
      - name: Run Loom tests
        run: |
          cargo test --features loom,persistence \
            -p velesdb-core --test loom_tests \
            -- --test-threads=1
        env:
          RUSTFLAGS: "--cfg loom"
          # Limite les permutations pour éviter explosion combinatoire
          LOOM_MAX_PREEMPTIONS: 3

      # Tests Loom inline dans storage/
      - name: Run Loom storage tests
        run: |
          cargo test --features loom,persistence \
            -p velesdb-core storage::loom \
            -- --test-threads=1
        env:
          RUSTFLAGS: "--cfg loom"
          LOOM_MAX_PREEMPTIONS: 3

  # ===========================================================================
  # Fuzzing - Robustesse des parsers et APIs exposées
  # ===========================================================================
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_fuzz }}
    timeout-minutes: 30
    env:
      # nightly: cargo-fuzz instruments with -Zsanitizer.
      # Set for the whole job, so rust-cache's `cargo metadata` stays on it
      # too instead of falling back to rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nightly: cargo fuzz needs it; installed here, so rustup never installs it mid-step.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-fuzz"
          save-if: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # VelesQL Parser - input utilisateur critique
      - name: Fuzz VelesQL parser
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_velesql_parser \
            -- -max_total_time=${{ inputs.fuzz_duration || 300 }}
        # No continue-on-error: reaching max_total_time without a crash exits 0,
        # so a non-zero exit here IS a found crash and must fail the job.

      # Distance metrics - données vectorielles
      - name: Fuzz distance metrics
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_distance_metrics \
            -- -max_total_time=${{ inputs.fuzz_duration || 300 }}
        # No continue-on-error: reaching max_total_time without a crash exits 0,
        # so a non-zero exit here IS a found crash and must fail the job.

      # Snapshot parser - fichiers de persistance
      - name: Fuzz snapshot parser
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_snapshot_parser \
            -- -max_total_time=${{ inputs.fuzz_duration || 300 }}
        # No continue-on-error: reaching max_total_time without a crash exits 0,
        # so a non-zero exit here IS a found crash and must fail the job.

      # Upload crash artifacts si trouvés
      - name: Upload crash artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 30

  # ===========================================================================
  # cargo-careful - Debug assertions dans la std (optionnel)
  # ===========================================================================
  careful:
    name: Careful (extra checks)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 20
    continue-on-error: true
    env:
      # nightly: cargo-careful rebuilds std with -Zbuild-std.
      # Set for the whole job, so rust-cache's `cargo metadata` stays on it
      # too instead of falling back to rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nightly: cargo careful needs it; installed here, so rustup never installs it mid-step.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-careful
        run: cargo install cargo-careful

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-careful"

      # Tests avec assertions std activées
      - name: Run careful tests
        run: |
          cargo +nightly careful test \
            -p velesdb-core \
            --no-default-features \
            -- --test-threads=1

  # ===========================================================================
  # Minimal versions: velesdb-core and velesdb-memory each still compile at the
  # lowest dependency versions their manifests allow, on Linux and macOS
  # ===========================================================================
  # A fresh resolve picks the newest version of everything, so it never meets
  # a lower bound that is too low. The consumer who does is one whose other
  # dependencies hold a crate at the bottom of the range our manifest allows:
  # a `foo = "1.2"` whose code needs 1.4 then fails in their build, never in
  # ours. `-Z direct-minimal-versions` builds that consumer: each direct
  # dependency at the lowest version its requirement allows, transitive ones
  # at their newest. The check runs on the MSRV toolchain rust-toolchain.toml
  # pins.
  #
  # One crate per leg, resolved in a workspace cut down to it: its path
  # dependencies (velesdb-core, for velesdb-memory) come back in on their own,
  # and nothing else does. A consumer of velesdb-core never resolves
  # tauri-plugin-velesdb's graph, so a floor that graph imposes is not one
  # velesdb-core needs, and a joint resolve would hide the difference.
  #
  # Linux and macOS, because a lower bound can build on one and not the other:
  # tar 0.4.0-0.4.2 masks `st_mode` with `libc::S_IFMT`, a u16 on macOS, and
  # fails there only. Windows is not checked. velesdb-core and velesdb-memory
  # are the two crates ci.yml's `semver-checks` also scopes itself to; the other
  # published members (velesdb-server, velesdb-cli, velesdb-migrate,
  # velesdb-mobile, tauri-plugin-velesdb) are not compiled here.
  #
  # Not a merge gate: this workflow is outside ci.yml, so `CI Success` never
  # reads it, and its verdict can move with no change here whenever a
  # dependency publishes. A source change that starts using a newer API
  # without raising the bound is caught by the weekly run, not on its PR.
  minimal-versions:
    name: Minimal versions (${{ matrix.crate }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_minimal_versions }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crate: [velesdb-core, velesdb-memory]
    env:
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed before rust-cache, whose `cargo metadata` runs on it, and
      # before the check below, which builds with it.
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal

      # nightly: `cargo update -Z direct-minimal-versions` is unstable. Only
      # the resolve step names it (`cargo +nightly`); the check does not.
      - name: Install nightly for the resolve
        run: rustup toolchain install nightly --no-self-update --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "velesdb-minimal-versions-${{ matrix.crate }}"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Keep only this crate in the workspace
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          crate = os.environ["CRATE"]
          root = pathlib.Path("Cargo.toml")
          text = root.read_text()
          kept = []
          for member in tomllib.loads(text)["workspace"]["members"]:
              if tomllib.loads(pathlib.Path(member, "Cargo.toml").read_text())["package"]["name"] == crate:
                  kept.append(member)
              else:
                  text = re.sub(rf'^\s*"{re.escape(member)}",?\n', "", text, flags=re.M)
          if len(kept) != 1:
              raise SystemExit(f"{crate} is not exactly one workspace member: {kept}")
          root.write_text(text)
          PY
          sed -n '/^members/,/^]/p' Cargo.toml

      # `fallback` keeps the transitive picks within the workspace MSRV, so a
      # dependency whose newest release needs a newer rustc is not reported as
      # a lower-bound failure.
      - name: Resolve direct dependencies to their minimal versions
        run: cargo +nightly update -Z direct-minimal-versions
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Check the crate at its minimal versions
        run: cargo check -p "$CRATE" --all-features

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [miri, loom, fuzz]
    # A pull request runs minimal-versions alone: a table of three skipped
    # jobs would report nothing.
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Results
        run: |
          echo "## Quality Deep Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Miri | ${{ needs.miri.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Loom | ${{ needs.loom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzz | ${{ needs.fuzz.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
