name: PR Governance

# Called by ci.yml on pull requests (see the note in gate-contracts.yml). Its
# three checks — Git Flow, branch freshness, AI attribution — used to report
# BESIDE the only required check instead of inside it, so none of them could
# block a merge (#1698). Branch freshness in particular is this repository's
# replacement for branch protection's `strict` (decision #1639), and was
# therefore protected by nobody.
#
# `branches-ignore` rather than no `pull_request:` at all: ci.yml is filtered
# to `branches: [main, develop]`, so folding without this would have silently
# dropped the "PR targets '<x>', which is not a valid Git Flow integration
# branch" refusal for every other target. Fold + this filter = the same
# coverage as before, with the main/develop half now required.
on:
  workflow_call:
  pull_request:
    branches-ignore: [main, develop]
    # `edited` catches a retarget: it is the only event a base change emits,
    # so without it this gate keeps reporting its verdict on the *old* base
    # forever. A re-run cannot clear that — GitHub replays the original event
    # payload, stale BASE_REF included. Guarded below so title and body edits
    # do not re-run it.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Git Flow & Freshness Checks
    runs-on: ubuntu-latest
    steps:
      # ci.yml also runs on `push` and `workflow_dispatch`, where there is no
      # pull_request payload at all: every step below would then read an empty
      # base ref and fail on nothing. Conditioning the steps (rather than the
      # caller job) keeps the job's result `success` instead of `skipped` —
      # `CI Success` demands `== "success"` exactly, and a skip would fail the
      # chain on every push to develop.
      - name: No pull request to govern
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "event '${{ github.event_name }}' carries no pull_request payload:"
          echo "Git Flow, branch freshness and attribution have nothing to assert."

      # The policy is executable repository code now, so the checkout must
      # precede even the source/target-only half of the guard -- and it must
      # run on EVERY event, not just `pull_request`. It carried
      # `if: github.event_name == 'pull_request'` while the tracked-content
      # step below carries no condition at all, so on a push to main/develop
      # that step ran with no repository on disk and died on
      # `can't open file 'scripts/check-ai-attribution.py'` (exit 2). Every
      # push run of ci.yml had been red since that step was added -- unnoticed
      # because the required checks all run on pull_request, where the
      # checkout did happen. `github.sha` is the fallback ref: on a push the
      # pull_request payload is empty, and an empty `ref:` is not the same as
      # an absent one.
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Enforce PR source and Git Flow rules
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 scripts/check-pr-governance.py \
            --guard git-flow \
            --source-ref "$SOURCE_REF" \
            --base-ref "$BASE_REF"

      - name: Fetch latest base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "${BASE_REF}" --depth=1

      - name: Verify branch includes latest base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 scripts/check-pr-governance.py \
            --guard freshness \
            --root . \
            --base-ref "$BASE_REF" \
            --base-commit "origin/${BASE_REF}"

      - name: Reject AI-attributed commits
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Commits introduced by this PR must be authored as the human
          # maintainer, with no AI/assistant identity or attribution trailers.
          # The rule lives in ONE place, tested: the two inline copies knew
          # `claude|anthropic` and nothing else, so Codex, Copilot, Cursor
          # and unlisted bots walked through (#1699). Infrastructure
          # automation is admitted by name there, never by a wildcard —
          # dependabot[bot] has 149 legitimate commits here.
          git fetch origin "${BASE_REF}" --depth=200
          python3 scripts/check-ai-attribution.py "origin/${BASE_REF}..HEAD"

      - name: Reject an AI-attributed pull request title or body
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Via env, never interpolated into the script below: a title and a
          # body are attacker-controlled text, and `${{ }}` inside a `run:`
          # block is a script-injection vector. The guard then reads each as a
          # FILE, so the text never becomes a shell argument either.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Commits were the only surface the rule was enforced on, and the
          # body is the one it loses on by default: tooling appends a
          # "Generated by ..." footer server-side, so a PR can arrive already
          # violating CLAUDE.md #5 with every commit in it clean. The title is
          # named by the rule too and was equally unguarded. Same guard, same
          # pattern list for both — a second list would drift.
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check-ai-attribution.py \
            --text "$RUNNER_TEMP/pr-title.txt" --surface "pull request title"
          python3 scripts/check-ai-attribution.py \
            --text "$RUNNER_TEMP/pr-body.md" --surface "pull request body"

      - name: Reject AI attribution in tracked content
        run: |
          # The "code, comments, docs" half of CLAUDE.md #5, which no guard
          # covered: a footer pasted into a markdown file, or a
          # `// Generated with ...` comment left in a source file, was refused
          # in a commit message and accepted three lines into the file that
          # commit added. Files that must carry the patterns to define or
          # document the rule are admitted by exact path in the guard, never by
          # a directory wildcard.
          python3 scripts/check-ai-attribution.py --tree
