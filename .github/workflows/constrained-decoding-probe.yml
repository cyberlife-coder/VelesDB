name: Verify Constrained Decoding

# One question, one real model, no GPU: does Ollama's `format` keep a section
# the schema does not declare? It decides whether the campaign's schema (#1943),
# which omits `facts`, would have silently emptied every extraction — and so
# whether the superset the crate now sends (#1944) is prudence or a correction.
#
# Deliberately NOT part of `CI Success`: it pulls a model and talks to a local
# daemon, which is not a gate any PR should wait on. It runs on push to its own
# branch and on manual dispatch, and it reports rather than blocks.

on:
  push:
    branches:
      - ci/verify-constrained-decoding
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model id (CPU-sized — this runner has no GPU)"
        required: false
        default: "qwen3:0.6b"

permissions:
  contents: read

jobs:
  verify:
    name: Does `format` keep what it does not name?
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/ > /dev/null; then
              echo "ollama up"; exit 0
            fi
            sleep 2
          done
          echo "ollama never came up"; cat "${RUNNER_TEMP}/ollama.log"; exit 1

      - name: Pull the model
        env:
          MODEL: ${{ github.event.inputs.model || 'qwen3:0.6b' }}
        run: |
          # A small model is the RIGHT instrument here, not a concession: the
          # question is a property of the grammar compiler, identical at every
          # size. A 14B model would answer the same thing and take an hour of
          # CPU inference to do it.
          ollama pull "$MODEL"
          ollama list

      - name: Verify
        env:
          MODEL: ${{ github.event.inputs.model || 'qwen3:0.6b' }}
        run: |
          python3 scripts/constrained-decoding-probe.py \
            --model "$MODEL" \
            --out "${RUNNER_TEMP}/constrained-decoding.json"

      - name: Upload the raw replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constrained-decoding-run
          path: ${{ runner.temp }}/constrained-decoding.json
          if-no-files-found: warn

  campaign:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    # A 14B model generates at a few tokens a second on four cores. The cap is
    # the GitHub job ceiling minus a margin, not an estimate of the work.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # Every entry is a model the published campaign ALREADY measured
        # unconstrained, so each result lands beside a reference row instead of
        # in a vacuum. `qwen3:14b` is here despite already scoring zero fatal
        # errors: the open question there is not whether constrained decoding
        # helps but whether it HURTS a model that had nothing left to fix.
        model:
          - qwen3:4b-instruct
          - qwen3.5:4b
          - llama3.1:8b
          - qwen3:8b
          - qwen3:14b
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk for the larger weights
        run: |
          # A 14B pull is ~9 GB against ~14 GB free. Removing toolchains this
          # job never uses buys ~20 GB and costs seconds.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY}" /usr/local/lib/android || true
          df -h / | tail -1

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/ > /dev/null; then
              echo "ollama up"; exit 0
            fi
            sleep 2
          done
          echo "ollama never came up"; cat "${RUNNER_TEMP}/ollama.log"; exit 1

      - name: Pull ${{ matrix.model }}
        run: |
          ollama pull "${{ matrix.model }}"
          ollama list

      - name: Reference arm
        run: |
          # `screen` exits 1 on a FATAL error, which on these models is a
          # result rather than a broken run. The artefact is the separator: a
          # written JSON means it measured, a missing one means it could not.
          python3 scripts/bench-memory-extraction.py screen \
            --backend ollama --config "${{ matrix.model }}" \
            --url http://localhost:11434 --num-ctx 4096 \
            --out "${RUNNER_TEMP}/reference.json" || true
          test -f "${RUNNER_TEMP}/reference.json" \
            || { echo "reference arm produced no result — it could not measure"; exit 1; }

      - name: Constrained arm
        run: |
          python3 scripts/bench-memory-extraction.py screen \
            --backend ollama --config "${{ matrix.model }}" --constrained \
            --url http://localhost:11434 --num-ctx 4096 \
            --out "${RUNNER_TEMP}/constrained.json" || true
          test -f "${RUNNER_TEMP}/constrained.json" \
            || { echo "constrained arm produced no result — it could not measure"; exit 1; }

      - name: Summarise
        if: always()
        run: |
          for arm in reference constrained; do
            file="${RUNNER_TEMP}/${arm}.json"
            [ -f "$file" ] || { echo "${arm}: not produced"; continue; }
            python3 - "$file" "$arm" "${{ matrix.model }}" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          totals, model, arm = run["totals"], sys.argv[3], sys.argv[2]
          # Eligibility is zero fatal AND every reply parsed AND a French/English
          # gap within tolerance. Printing only the first two invites a verdict
          # the data does not support, so the per-language split is printed too.
          langs = run.get("by_language", {})
          gap = " ".join(
              f"{lang}:{t.get('fatal')}f/{t.get('major')}m" for lang, t in sorted(langs.items()))
          quality = "n/a (nothing parsed)" if totals["parse_rate"] == 0 else \
                    f"major={totals['major']} minor={totals['minor']}"
          print(f"{model:20} {arm:12} fatal={totals['fatal']} {quality} "
                f"parse_rate={totals['parse_rate']:.4f} truncated={totals['truncated']}")
          print(f"{'':20} {'':12} settings={run.get('settings')}")
          print(f"{'':20} {'':12} by_language={gap or 'absent'}")
          PY
          done

      - name: Upload both arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Slashes and colons are not allowed in artifact names.
          name: campaign-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/reference.json
            ${{ runner.temp }}/constrained.json
          if-no-files-found: warn
