name: Verify Constrained Decoding

# One question, one real model, no GPU: does Ollama's `format` keep a section
# the schema does not declare? It decides whether the campaign's schema (#1943),
# which omits `facts`, would have silently emptied every extraction — and so
# whether the superset the crate now sends (#1944) is prudence or a correction.
#
# Deliberately NOT part of `CI Success`: it pulls a model and talks to a local
# daemon, which is not a gate any PR should wait on. It runs on push to its own
# branch and on manual dispatch, and it reports rather than blocks.

on:
  push:
    branches:
      - ci/verify-constrained-decoding
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model id (CPU-sized — this runner has no GPU)"
        required: false
        default: "qwen3:0.6b"

permissions:
  contents: read

jobs:
  verify:
    name: Does `format` keep what it does not name?
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/ > /dev/null; then
              echo "ollama up"; exit 0
            fi
            sleep 2
          done
          echo "ollama never came up"; cat "${RUNNER_TEMP}/ollama.log"; exit 1

      - name: Pull the model
        env:
          MODEL: ${{ github.event.inputs.model || 'qwen3:0.6b' }}
        run: |
          # A small model is the RIGHT instrument here, not a concession: the
          # question is a property of the grammar compiler, identical at every
          # size. A 14B model would answer the same thing and take an hour of
          # CPU inference to do it.
          ollama pull "$MODEL"
          ollama list

      - name: Verify
        env:
          MODEL: ${{ github.event.inputs.model || 'qwen3:0.6b' }}
        run: |
          python3 scripts/constrained-decoding-probe.py \
            --model "$MODEL" \
            --out "${RUNNER_TEMP}/constrained-decoding.json"

      - name: Upload the raw replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constrained-decoding-run
          path: ${{ runner.temp }}/constrained-decoding.json
          if-no-files-found: warn

  campaign:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    # A 14B model generates at a few tokens a second on four cores. The cap is
    # the GitHub job ceiling minus a margin, not an estimate of the work.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # Every entry is a model the published campaign ALREADY measured
        # unconstrained, so each result lands beside a reference row instead of
        # in a vacuum. `qwen3:14b` is here despite already scoring zero fatal
        # errors: the open question there is not whether constrained decoding
        # helps but whether it HURTS a model that had nothing left to fix.
        model:
          - qwen3:4b-instruct
          - qwen3.5:4b
          - llama3.1:8b
          - qwen3:8b
          - qwen3:14b
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk for the larger weights
        run: |
          # A 14B pull is ~9 GB against ~14 GB free. Removing toolchains this
          # job never uses buys ~20 GB and costs seconds.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY}" /usr/local/lib/android || true
          df -h / | tail -1

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/ > /dev/null; then
              echo "ollama up"; exit 0
            fi
            sleep 2
          done
          echo "ollama never came up"; cat "${RUNNER_TEMP}/ollama.log"; exit 1

      - name: Pull ${{ matrix.model }}
        run: |
          ollama pull "${{ matrix.model }}"
          ollama list

      - name: Reference arm
        run: |
          # `screen` exits 1 on a FATAL error, which on these models is a
          # result rather than a broken run. The artefact is the separator: a
          # written JSON means it measured, a missing one means it could not.
          python3 scripts/bench-memory-extraction.py screen \
            --backend ollama --config "${{ matrix.model }}" \
            --url http://localhost:11434 --num-ctx 4096 \
            --out "${RUNNER_TEMP}/reference.json" || true
          test -f "${RUNNER_TEMP}/reference.json" \
            || { echo "reference arm produced no result — it could not measure"; exit 1; }

      - name: Constrained arm
        run: |
          python3 scripts/bench-memory-extraction.py screen \
            --backend ollama --config "${{ matrix.model }}" --constrained \
            --url http://localhost:11434 --num-ctx 4096 \
            --out "${RUNNER_TEMP}/constrained.json" || true
          test -f "${RUNNER_TEMP}/constrained.json" \
            || { echo "constrained arm produced no result — it could not measure"; exit 1; }

      - name: Summarise
        if: always()
        run: |
          for arm in reference constrained; do
            file="${RUNNER_TEMP}/${arm}.json"
            [ -f "$file" ] || { echo "${arm}: not produced"; continue; }
            python3 - "$file" "$arm" "${{ matrix.model }}" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          totals, model, arm = run["totals"], sys.argv[3], sys.argv[2]
          # Eligibility is zero fatal AND every reply parsed AND a French/English
          # gap within tolerance. Printing only the first two invites a verdict
          # the data does not support, so the per-language split is printed too.
          langs = run.get("by_language", {})
          gap = " ".join(
              f"{lang}:{t.get('fatal')}f/{t.get('major')}m" for lang, t in sorted(langs.items()))
          quality = "n/a (nothing parsed)" if totals["parse_rate"] == 0 else \
                    f"major={totals['major']} minor={totals['minor']}"
          print(f"{model:20} {arm:12} fatal={totals['fatal']} {quality} "
                f"parse_rate={totals['parse_rate']:.4f} truncated={totals['truncated']}")
          print(f"{'':20} {'':12} settings={run.get('settings')}")
          print(f"{'':20} {'':12} by_language={gap or 'absent'}")
          PY
          done

      - name: Upload both arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Slashes and colons are not allowed in artifact names.
          name: campaign-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/reference.json
            ${{ runner.temp }}/constrained.json
          if-no-files-found: warn

  endtoend:
    name: e2e ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # Two models, not five. Phase B runs the real daemon and waits for each
        # durable commit, so it costs far more per passage than screening — and
        # the question it answers is not "which model ranks where" but "does the
        # graph the daemon KEEPS match what the model said". One small model to
        # make that cheap to observe, one that the screening phase showed
        # reaching zero fatal errors under constraint.
        model:
          - qwen3:0.6b
          - qwen3:8b
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY}" /usr/local/lib/android || true
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the daemon
        run: |
          # Phase B drives the REAL binary. Built from this branch, so what runs
          # is the extractor this PR changed rather than a released one.
          cargo build --release -p velesdb-memory \
            --features persistence,mcp,extractor-http,embedder-http
          ls -la target/release/velesdb-memory

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/ > /dev/null; then echo up; exit 0; fi
            sleep 2
          done
          echo "ollama never came up"; cat "${RUNNER_TEMP}/ollama.log"; exit 1

      - name: Pull the extractor and the embedder
        run: |
          # Phase B needs BOTH: the daemon embeds every stored fact as well as
          # extracting it, and an absent embedder fails as a storage error that
          # would read as a model result.
          ollama pull "${{ matrix.model }}"
          ollama pull bge-m3
          ollama list

      - name: Handshake
        env:
          VELESDB_MEMORY_EMBEDDER: ollama
          VELESDB_MEMORY_OLLAMA_MODEL: bge-m3
          VELESDB_MEMORY_EXTRACTOR: ollama
          VELESDB_MEMORY_EXTRACTOR_MODEL: ${{ matrix.model }}
          VELESDB_MEMORY_EXTRACTOR_URL: http://localhost:11434
        run: |
          # Proves the client and the tool surface agree BEFORE spending an hour
          # on generation: a daemon missing `remember_extracted` would otherwise
          # report "tool not found" once per passage as if it were a result.
          #
          # Launched exactly as `DisposableDaemon.start` launches it — same
          # flags, same env — so a handshake that passes says something about
          # the run that follows.
          export VELESDB_MEMORY_PATH="${RUNNER_TEMP}/handshake-store"
          mkdir -p "$VELESDB_MEMORY_PATH"
          printf '[graph]\nautograph = true\n' > "$VELESDB_MEMORY_PATH/velesdb-memory.toml"
          nohup ./target/release/velesdb-memory --http --http-port 18098 \
            > "${RUNNER_TEMP}/daemon.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -skf https://127.0.0.1:18098/health > /dev/null && break
            sleep 2
          done
          python3 scripts/bench-memory-extraction.py probe --url https://127.0.0.1:18098 \
            || { echo "--- daemon log ---"; cat "${RUNNER_TEMP}/daemon.log"; exit 1; }
          pkill -f "velesdb-memory --http" || true

      - name: End-to-end
        run: |
          python3 scripts/bench-memory-extraction.py endtoend \
            --binary ./target/release/velesdb-memory \
            --backend ollama --config "${{ matrix.model }}" \
            --embedder bge-m3 --url http://localhost:11434 \
            --out "${RUNNER_TEMP}/endtoend.json" || true
          test -f "${RUNNER_TEMP}/endtoend.json" \
            || { echo "no result — it could not measure"; exit 1; }

      - name: Summarise
        if: always()
        run: |
          file="${RUNNER_TEMP}/endtoend.json"
          [ -f "$file" ] || { echo "not produced"; exit 0; }
          python3 - "$file" "${{ matrix.model }}" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          totals = run["totals"]
          # The measurement this whole job exists for: an edge that reached the
          # graph, or the absence of one. Reported as a count, never as a bare
          # duration, because a drain that never completed has no duration.
          drained = sum(
              1 for case in run.get("cases", [])
              if any(p.get("relations") or p.get("attributes")
                     for p in (case.get("entities") or {}).values()))
          print(f"{sys.argv[2]}: fatal={totals['fatal']} major={totals['major']} "
                f"cases_with_edges={drained}/{len(run.get('cases', []))} "
                f"max_drain={totals.get('max_drain_seconds')}")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endtoend-${{ strategy.job-index }}
          path: ${{ runner.temp }}/endtoend.json
          if-no-files-found: warn
