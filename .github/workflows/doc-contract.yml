name: Doc Contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'crates/velesdb-server/src/main.rs'
      - 'scripts/check-doc-contract.sh'
      - '.github/workflows/doc-contract.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'crates/velesdb-server/src/main.rs'
      - 'scripts/check-doc-contract.sh'
      - '.github/workflows/doc-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: README Runtime Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check README/runtime contract
        run: bash scripts/check-doc-contract.sh
